[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-submission-analyzer"
dynamic = ["version"]
description = "Online-school submission intake and pluggable analyzers (MAI Python labs, AI/MLOps track)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
submission-analyzer = "submission_analyzer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "submission_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
